# Build spec for the Storybook app — a SECOND Amplify app on this same repo.
# Point that app's build spec at this file; the portfolio keeps amplify.yml.
#
# This is deliberately NOT a copy of amplify.yml. Two things in that file are
# actively wrong here, and both were verified against a real `build-storybook`
# output rather than assumed:
#
#   - `npm install --omit=dev` skips the entire Storybook tree. That flag exists
#     in amplify.yml precisely because the portfolio build never needs it.
#   - The portfolio's security headers break Storybook outright. Its zero-JS CSP
#     is a property of the portfolio, not of this repository.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Reuse the Node 24.x already in the Amplify build image (see .nvmrc).
        - nvm use 2>/dev/null || nvm install
        - node -v && npm -v
        # No --omit=dev: Storybook, Vite's plugin and the whole build toolchain
        # live in devDependencies, so omitting them leaves nothing to build with.
        #
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD still applies — the Chromium binaries
        # are only needed by the browser-mode Vitest project, which does not run
        # here. Skipping them saves ~300MB per build.
        - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund --prefer-offline
    build:
      commands:
        - npm run build-storybook
  artifacts:
    baseDirectory: storybook-static
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        # SAMEORIGIN, not DENY. `iframe.html` IS Storybook's preview canvas —
        # every story renders inside a same-origin iframe, and DENY blocks it,
        # leaving the whole canvas blank.
        - key: X-Frame-Options
          value: SAMEORIGIN
        - key: X-Content-Type-Options
          value: nosniff
        - key: Referrer-Policy
          value: strict-origin-when-cross-origin
        - key: Strict-Transport-Security
          value: 'max-age=63072000; includeSubDomains; preload'
        # Far looser than the portfolio's, and each relaxation is here for a
        # reason found in the built output:
        #   'unsafe-inline' — index.html carries 3 inline <script> blocks and
        #                     iframe.html carries 5
        #   'unsafe-eval'   — sb-manager/globals-runtime.js and the syntax
        #                     highlighter chunk both use eval()
        #   worker-src blob: — the same bundles construct `new Worker`
        #   frame-src/frame-ancestors 'self' — the preview iframe
        - key: Content-Security-Policy
          value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
        - key: Permissions-Policy
          value: 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()'
    # Storybook fingerprints its own assets, so they are safe to pin.
    - pattern: '/assets/**'
      headers:
        - key: Cache-Control
          value: 'public, max-age=31536000, immutable'
